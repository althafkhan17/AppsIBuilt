<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Fast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Type Fast</h1>
      <p class="tagline">30 seconds. Type the text. See your WPM and accuracy.</p>
    </header>
    <section class="stats">
      <div class="stat"><span id="time">30</span><small>seconds</small></div>
      <div class="stat"><span id="wpm">0</span><small>wpm</small></div>
      <div class="stat"><span id="acc">100</span><small>% accuracy</small></div>
    </section>
    <section class="card">
      <div id="text" class="text" aria-label="Text to type"></div>
      <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Start typing to begin...">
    </section>
    <section class="card" id="result" hidden>
      <h2>Result</h2>
      <p id="result-text"></p>
      <p class="muted">Best: <strong id="best">0</strong> wpm</p>
    </section>
    <div class="actions"><button id="restart">Restart</button></div>
    <footer>by <a href="https://github.com/althafkhan17">althafkhan17</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
