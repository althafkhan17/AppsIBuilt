<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Math</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><h1>Quick Math</h1><p class="tagline">60 seconds. How many can you solve?</p></header>
<section class="card">
<div class="stats"><span>Time <b id="time">60</b></span><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<div id="question" class="question">Ready?</div>
<form id="form"><input id="answer" type="number" inputmode="numeric" autocomplete="off" disabled placeholder="Answer"><button id="start" type="button">Start</button></form>
<p id="msg" class="msg"></p>
</section>
<footer>by <a href="https://github.com/althafkhan17">althafkhan17</a></footer>
</main><script src="app.js"></script></body></html>
