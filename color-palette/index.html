<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hue Hunt</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header><h1>Hue Hunt</h1><p class="tagline">Press space or the button to get a new palette. Click a colour to lock it.</p></header>
<div class="controls"><select id="mode"><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="triadic">Triadic</option><option value="random">Random</option></select>
<button id="gen">Generate</button></div>
<div id="palette" class="palette"></div>
<p id="msg" class="msg"></p>
<h2>Saved</h2><div id="saved" class="saved"></div>
<button id="save" class="ghost">Save this palette</button>
<footer>by <a href="https://github.com/althafkhan17">althafkhan17</a></footer>
</div><script src="app.js"></script></body></html>
