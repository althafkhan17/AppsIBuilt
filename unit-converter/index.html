<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Swap</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card">
<h1>🔄 Unit Swap</h1>
<div class="tabs" id="tabs"></div>
<input id="val" type="number" step="any" value="1" aria-label="Value">
<div class="row"><select id="from" aria-label="From"></select><button id="swap" title="Swap">⇄</button><select id="to" aria-label="To"></select></div>
<div class="result" id="result"></div>
<h2>Recent</h2><ul id="history"></ul>
<p class="foot">by <a href="https://github.com/althafkhan17">althafkhan17</a></p>
</main><script src="app.js"></script></body></html>
